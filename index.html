<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Du coup — le compteur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="kicker">Compteur de tic de langage</p>
        <h1>Du coup.</h1>
        <p class="intro">Chaque fois que vous le dites, le compteur prend un point.</p>
      </header>

      <section class="counter" aria-live="polite" aria-atomic="true">
        <span class="count-label">entendus</span>
        <output id="score">0</output>
        <div id="wave" class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      </section>

      <section class="controls">
        <button id="listen" type="button"><span class="dot"></span><span id="button-text">Commencer l'écoute</span></button>
        <button id="reset" class="reset" type="button">Remettre à zéro</button>
      </section>

      <p id="status" class="status">Le micro est en pause.</p>
      <p id="transcript" class="transcript">Les mots entendus apparaîtront ici.</p>
    </main>
    <footer>Tout reste dans votre navigateur. Le compteur comprend aussi « du-coup ».</footer>
    <script src="app.js"></script>
  </body>
</html>
